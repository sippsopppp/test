<!DOCTYPE html><html><head><title>Clock</title><style>body { font-family: Arial, sans-serif; }</style></head><body><h1 id="clock"></h1><script>function updateTime() { const now = new Date(); const clock = document.getElementById('clock'); clock.innerText = now.toLocaleTimeString(); }setInterval(updateTime, 1000);</script></body></html>
